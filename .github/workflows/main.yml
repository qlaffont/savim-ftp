name: CI
on: [push]
jobs:
  build:
    name: Build, lint, and test on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    services:
      ftp:
        image: delfer/alpine-ftp-server
        env:
          USERS: test|thisisapassword
        ports:
          - 21:21
          - 21000-21010:21000-21010

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Test
        run: sleep 5 && bun test --coverage

      - name: Build
        run: bun run build

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    services:
      ftp:
        image: delfer/alpine-ftp-server
        env:
          USERS: test|thisisapassword
        ports:
          - 21:21
          - 21000-21010:21000-21010
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: sleep 5 && bun test --coverage
      - uses: paambaati/codeclimate-action@v9.0.0
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        with:
          debug: true
